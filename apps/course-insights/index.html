      :root{--cip-bg:#0B1020;--cip-text:#E8ECF8;--cip-muted:#98A3C2;--cip-field:#0E1529;--cip-line:#2E3A5E;--cip-line2:#232C48;
        --cip-panel:rgba(255,255,255,0.04);--cip-bar:rgba(18,26,48,0.55);--cip-card:rgba(18,26,48,0.7);
        --cip-paper-shadow:0 30px 80px -30px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.06);
        --cip-shell:radial-gradient(900px 600px at 8% -10%,rgba(43,75,214,0.28),transparent 60%),radial-gradient(800px 600px at 100% 110%,rgba(14,143,116,0.2),transparent 60%),#0B1020}

        --cip-paper-shadow:0 1px 2px rgba(26,31,43,0.05),0 18px 48px -24px rgba(26,31,43,0.3),0 0 0 1px #E4E7EC;
        --cip-shell:radial-gradient(900px 600px at 8% -10%,rgba(191,208,255,0.55),transparent 60%),radial-gradient(800px 600px at 100% 110%,rgba(189,235,221,0.5),transparent 60%),#F6F8FC}
